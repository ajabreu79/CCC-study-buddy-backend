name: build_publish_dev

on:
  # Example: run on all branches EXCEPT master/main
  push:
    branches-ignore:
      - master
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/conver-flow:dev
  SEC_FILE_NAME: edcwsxqaz

jobs:
  publish:
    name: Publish Docker Image (Dev)
    runs-on: ubuntu-latest

    steps:
      # 1) Convert IMAGE_NAME to lowercase (some registries require it).
      - id: string
        uses: ASzc/change-string-case-action@v5
        with:
          string: ${{ env.IMAGE_NAME }}

      # 2) Update the IMAGE_NAME variable with the lowercase output.
      - id: updateenv
        run: echo "IMAGE_NAME=${{ steps.string.outputs.lowercase }}" >> $GITHUB_ENV

      # 3) Check out the code.
      - uses: actions/checkout@v4

      # 4) Log in to GHCR (using GITHUB_TOKEN or a personal access token).
      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5) Build & Push to GHCR.
      - name: Build and Push Docker Image
        run: |
          docker build . --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

  deploy:
    name: Deploy (Dev)
    # Run only after the publish job completes successfully.
    needs: publish
    runs-on: ubuntu-latest

    steps:
      # 1) Install SSH key so we can connect to remote server.
      - name: Install SSH Keys
        run: |
          # Create the .ssh directory if it doesn't exist.
          mkdir -p ~/.ssh

          # Restrict permissions.
          install -m 600 -D /dev/null ~/.ssh/id_rsa

          # Write the private key from your secret.
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa

          # Add the remote SSH host to known hosts.
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

          # (Optional) Place your custom secret on the remote server, if needed.
          # E.g., create SEC_FILE_NAME file containing ${{ secrets.SEC }}:
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd ${{ secrets.WORK_DIR }} && echo '${{ secrets.SEC }}' > ${{ env.SEC_FILE_NAME }} && exit"

      # 2) Log into GHCR on remote, pull the new image, and restart the container.
      - name: Pull New Image & Run
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} " \
            echo '${{ secrets.PAT }}' | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin && \
            cd ${{ secrets.WORK_DIR }} && \
            # Stop + remove the current container if it’s running.
            docker stop conver-flow-server-dev || true && \
            docker rm conver-flow-server-dev || true && \
            # Pull the new dev image
            docker pull ghcr.io/${{ env.IMAGE_NAME }} && \
            # Example run command (adjust any environment vars/ports/etc.)
            docker run -d --name conver-flow-server-dev -p 3000:3000 ghcr.io/${{ env.IMAGE_NAME }} && \
            exit \
          "

      # 3) (Optional) Clean up secret file if you actually wrote one in the prior step.
      - name: Clean up Remote Secret (Optional)
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} " \
            cd ${{ secrets.WORK_DIR }} && \
            rm -f ${{ env.SEC_FILE_NAME }} && \
            exit \
          "

      # 4) Clean up local SSH keys on the runner.
      - name: Cleanup
        run: rm -rf ~/.ssh
