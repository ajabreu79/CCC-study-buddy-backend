name: build_publish_dev

on:
  # Run on pushes to all branches EXCEPT master/main
  push:
    branches-ignore:
      - master
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/conver-flow:dev
  SEC_FILE_NAME: edcwsxqaz

jobs:
  publish:
    name: Publish Docker Image (Dev)
    runs-on: ubuntu-latest

    steps:
      # 1) Convert IMAGE_NAME to lowercase (some registries require it).
      - id: string
        uses: ASzc/change-string-case-action@v5
        with:
          string: ${{ env.IMAGE_NAME }}

      # 2) Update the IMAGE_NAME variable with the lowercase output.
      - id: updateenv
        run: echo "IMAGE_NAME=${{ steps.string.outputs.lowercase }}" >> $GITHUB_ENV

      # 3) Check out the code so Docker can build it.
      - uses: actions/checkout@v4

      # 4) Log in to GHCR using your personal access token (PAT).
      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT }}

      # 5) Build and push the Docker image.
      - name: Build and Push Docker Image
        run: |
          docker build . --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

  deploy:
    name: Deploy (Dev)
    needs: publish
    runs-on: ubuntu-latest

    steps:
      # 1) Install SSH keys (so we can connect to remote server via ssh).
      - name: Install SSH Keys
        run: |
          mkdir -p ~/.ssh
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

          # (Optional) create the working directory and place a secret file there
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            mkdir -p ${{ secrets.WORK_DIR }} && \
            cd ${{ secrets.WORK_DIR }} && \
            echo '${{ secrets.SEC }}' > ${{ env.SEC_FILE_NAME }} && \
            exit
          "

      # 2) Log into GHCR on the remote server, pull the new image, and run (with restart=always).
      - name: Pull New Image & Run
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} " \
            echo '${{ secrets.PAT }}' | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin && \
            cd ${{ secrets.WORK_DIR }} && \
            # Stop + remove the current container if it’s running.
            docker stop conver-flow-server-dev || true && \
            docker rm conver-flow-server-dev || true && \
            # Pull the new dev image
            docker pull ghcr.io/${{ env.IMAGE_NAME }} && \
            # Run container in detached mode on host port 3000, container port 8000
            # (change to -p 3000:3000 if the container actually listens on 3000)
            docker run -d \
              --restart=always \
              --name conver-flow-server-dev \
              -p 3000:8000 \
              ghcr.io/${{ env.IMAGE_NAME }} && \
            exit \
          "

      # 3) (Optional) Remove that secret file from the remote server.
      - name: Clean up Remote Secret (Optional)
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} " \
            cd ${{ secrets.WORK_DIR }} && \
            rm -f ${{ env.SEC_FILE_NAME }} && \
            exit \
          "

      # 4) Clean up local SSH keys on GitHub runner.
      - name: Cleanup
        run: rm -rf ~/.ssh
